<!DOCTYPE html>
<html lang="">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <div id="wrapper">
        <header>
            <h1>Slideshow</h1>
        </header>

        <div id="slide">
            <ul>
                <li><img src="img/img1.jpg" alt="img1"></li>
                <li><img src="img/img2.jpg" alt="img2"></li>
                <li><img src="img/img3.jpg" alt="img3"></li>

        </div>
        
        <div id="button">
            <ul>
                <li><a href="#" class="target">1</a></li>
                <li><a href="#">2</a></li>
                <li><a href="#">3</a></li>
            </ul>
        </div>
    </div>
